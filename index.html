<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Gitar Nota Tahmin Oyunu (Pro)</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #1a1a2e; color: white; text-align: center; margin: 0; padding: 10px; 
        }
        
        .container { 
            width: 95%;
            max-width: 1000px; 
            margin: auto; 
            background: #16213e; 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }

        .header-panel { 
            display: flex; justify-content: space-around; background: #0f3460; 
            padding: 15px; border-radius: 10px; margin-bottom: 20px; 
        }
        .stat span { color: #e94560; font-size: 24px; font-weight: bold; }

        #hedef-alani {
            background: #0f3460; padding: 25px; border-radius: 15px; 
            margin-bottom: 20px; border: 3px solid #e94560; min-height: 120px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative;
        }
        #hedef-nota { font-size: 50px; color: #ffba08; font-weight: 900; }
        #bilgi-notu { font-size: 14px; color: #888; margin-bottom: 5px; text-transform: uppercase; }

        .klavye-container { 
            position: relative; 
            display: block; 
            background: #333;
            border: 4px solid #533483; 
            border-radius: 10px; 
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            opacity: 0.3; 
            transition: 0.3s;
            margin-top: 10px;
        }
        
        .oyun-aktif { pointer-events: auto !important; opacity: 1 !important; }

        #gitar-resmi { 
            min-width: 900px; 
            width: 100%; 
            height: auto;
            display: block; 
        }

        .nota-noktasi {
            position: absolute; 
            width: 38px; 
            height: 38px;
            background: rgba(233, 69, 96, 0.7); 
            border: 2px solid white;
            border-radius: 50%; 
            cursor: pointer; 
            transform: translate(-50%, -50%); 
            z-index: 100;
        }
        
        .nota-noktasi:hover { background: #2ecc71; transform: translate(-50%, -50%) scale(1.1); }

        #timer-bar {
            position: absolute; bottom: 0; left: 0; height: 8px;
            background: #4eeaf6; width: 0%; transition: width 0.1s linear;
        }

        .btn-start { 
            padding: 15px 40px; font-size: 20px; background: #2ecc71; 
            color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold;
        }

        @media screen and (max-width: 600px) and (orientation: portrait) {
            #hedef-alani::before {
                content: "📱 Telefonu yan çevirip kaydırarak oynayın!";
                display: block; font-size: 11px; color: #ffba08; margin-bottom: 8px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-panel">
        <div class="stat">Puan: <span id="puan">0</span></div>
        <div class="stat">Hak: <span id="hak">3</span></div>
        <div class="stat">En Yüksek: <span id="best">0</span></div>
    </div>

    <div id="hedef-alani">
        <div id="start-overlay">
            <button id="main-btn" class="btn-start" onclick="oyunuBaslat()">OYUNU BAŞLAT</button>
        </div>
        <div id="game-ui" style="display: none;">
            <div id="bilgi-notu">NOTAYI BUL:</div>
            <div id="hedef-nota">-</div>
        </div>
        <div id="timer-bar"></div>
    </div>

    <div class="klavye-container" id="klavye" style="pointer-events: none;">
        <img id="gitar-resmi" src="gitar.jpg" onerror="this.src='https://images.unsplash.com/photo-1550985616-10810253b84d?q=80&w=1000&auto=format&fit=crop';">

        <div class="nota-noktasi" style="top: 68.48%; left: 70.7%;" onclick="kontrol('Mİ', this)"></div>
        <div class="nota-noktasi" style="top: 35.3%; left: 60.9%;" onclick="kontrol('FA', this)"></div>

    </div>
</div>

<script>
    let puan = 0, hak = 3, mevcutHedef = "", süre = 50, zamanlayıcı;
    let enYuksekSkor = localStorage.getItem('gitarEnYuksek') || 0;
    const notalar = ['DO', 'RE', 'Mİ', 'FA', 'SOL', 'LA', 'Sİ'];
    
    // Hafıza: Her nota isminin son doğru bilinen konumunu tutar
    let sonBilinenFretler = {
        'DO': null, 'RE': null, 'Mİ': null, 'FA': null, 'SOL': null, 'LA': null, 'Sİ': null
    };

    document.getElementById('best').innerText = enYuksekSkor;

    let audioCtx;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    
    function sesCal(freq) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }

    function oyunuBaslat() {
        initAudio();
        puan = 0; hak = 3;
        sonBilinenFretler = { 'DO': null, 'RE': null, 'Mİ': null, 'FA': null, 'SOL': null, 'LA': null, 'Sİ': null };
        document.getElementById('puan').innerText = puan;
        document.getElementById('hak').innerText = hak;
        document.getElementById('start-overlay').style.display = 'none';
        document.getElementById('game-ui').style.display = 'block';
        document.getElementById('klavye').classList.add('oyun-aktif');
        document.getElementById('klavye').style.pointerEvents = "auto";
        yeniSoru();
    }

    function yeniSoru() {
        if (hak <= 0) return;
        clearInterval(zamanlayıcı);
        süre = 50;
        mevcutHedef = notalar[Math.floor(Math.random() * notalar.length)];
        
        document.getElementById('bilgi-notu').innerText = "NOTAYI BUL:";
        document.getElementById('bilgi-notu').style.color = "#888";
        document.getElementById('hedef-nota').innerText = mevcutHedef;
        document.getElementById('hedef-nota').style.color = "#ffba08";
        document.getElementById('timer-bar').style.width = "100%";

        zamanlayıcı = setInterval(() => {
            süre--;
            document.getElementById('timer-bar').style.width = (süre * 2) + "%";
            if (süre <= 0) hataYap("SÜRE DOLDU!");
        }, 100);
    }

        if (hak <= 0 || süre <= 0) return;

        if (tiklananNota === mevcutHedef) {

            if (sonBilinenFretler[tiklananNota] === konumId) {
